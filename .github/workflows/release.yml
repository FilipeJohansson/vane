name: Release

# Tags version the whole module at once (this is a single-module repo, no
# way to tag "just core" separately). Filtering what's public already
# happened once, at repo-creation time, not here - this workflow just
# gates the release behind the same checks CI already runs, then publishes
# prebuilt binaries as a convenience alongside `go install`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          go build -o "vane-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" .

      - uses: actions/upload-artifact@v4
        with:
          name: vane-${{ matrix.goos }}-${{ matrix.goarch }}
          path: vane-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 1

  # One non-matrix job publishes the release with every artifact attached, so
  # generate_release_notes only runs once instead of once per build leg.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `checks` runs ci.yml's whole workflow (via workflow_call), whose `e2e`
      # job also uploads artifacts (playwright-report, playwright-test-results)
      # into this same run. `pattern` keeps this step to only the binaries
      # this job's own `build` job produced.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vane-*
          merge-multiple: true

      - name: Create release with all binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # go install/go get resolve through proxy.golang.org, which lazily
  # fetches+caches a version on first request. Hitting the .info endpoint
  # here just means the very first real user of `@latest` isn't the one
  # paying that one-time fetch latency.
  warm-proxy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Ask proxy.golang.org to index this version
        run: curl -sf "https://proxy.golang.org/github.com/filipejohansson/vane/@v/${GITHUB_REF_NAME}.info"

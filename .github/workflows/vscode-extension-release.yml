name: VS Code Extension Release

on:
  push:
    tags: ['vscode-vane-v[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    defaults:
      run:
        working-directory: tools/vscode-vane
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: tools/vscode-vane/pnpm-lock.yaml

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#vscode-vane-v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: Publish to VS Code Marketplace
        run: pnpm exec vsce publish --no-dependencies -p "${{ secrets.VSCE_PAT }}"

name: VS Code Extension Release

on:
  push:
    tags: ['vscode-vane-v[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    defaults:
      run:
        working-directory: tools/vscode-vane
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: tools/vscode-vane/pnpm-lock.yaml

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#vscode-vane-v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: Publish to VS Code Marketplace
        # vsce's /_apis/gallery calls to the Marketplace time out intermittently, a known,
        # unresolved upstream issue (microsoft/vscode-vsce#1303, #926) with no fix on vsce's
        # side yet. Retry within this step, not by re-running the job, so a transient failure
        # doesn't require re-approving the environment's required reviewer each time.
        run: |
          for i in 1 2 3 4 5; do
            pnpm exec vsce publish --no-dependencies -p "${{ secrets.VSCE_PAT }}" && exit 0
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1

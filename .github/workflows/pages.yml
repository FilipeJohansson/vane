name: Deploy vane-page

on:
  push:
    branches: [master]
    paths: ['vane-page/**', 'core/**', 'internal/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time; a newer push supersedes
# whatever's still building instead of queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build CLI
        run: go build -o vane .

      # Deploy the docs against this checkout while local branch work is still
      # being validated. Tagged release builds remain the canonical published
      # module version; once Vane release tags are published consistently,
      # switch this to `go get github.com/filipejohansson/vane@latest` (or a
      # pinned tag) and remove the replace so the site tracks releases instead
      # of the active branch.
      - name: Point vane-page at this checkout's vane module
        run: (cd vane-page && go mod edit -replace github.com/filipejohansson/vane=../)

      - name: Build vane-page (release)
        run: ./vane build vane-page --release

      # vane-page/public/index.html references its own assets (style.css,
      # wasm_exec.js, boot.js, favicon.svg) with root-absolute paths, which
      # is correct for the local dev server (always served at "/") and for
      # any app deployed at its domain's root, but wrong here: this is a
      # GitHub Pages *project* page, served under the "/vane/" sub-path
      # instead of domain root, so those paths would otherwise resolve
      # against https://filipejohansson.github.io/ and 404. Prefixing them
      # at this one deploy-specific step keeps public/index.html itself
      # correct for every other use (local dev, `vane build` in general).
      - name: Fix asset paths for the /vane/ sub-path
        run: |
          sed -i \
            -e 's|href="/favicon.svg"|href="/vane/favicon.svg"|' \
            -e 's|href="/style.css"|href="/vane/style.css"|' \
            -e 's|src="/wasm_exec.js"|src="/vane/wasm_exec.js"|' \
            -e 's|src="/boot.js"|src="/vane/boot.js"|' \
            vane-page/dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vane-page/dist

      - uses: actions/deploy-pages@v4
        id: deployment

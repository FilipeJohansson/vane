name: Deploy vane-page

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      vane_version:
        description: >-
          Vane git tag to build vane-page against, e.g. v0.2.0. Leave empty to
          use the most recent tag.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time; a newer push supersedes
# whatever's still building instead of queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need full tag history to check out an arbitrary tag below

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build CLI
        run: go build -o vane .

      # git worktree, not `go get module@tag`: avoids depending on the Go
      # module proxy having indexed the tag yet.
      - name: Resolve Vane version to build vane-page against
        id: vane_ref
        run: |
          ref="${{ inputs.vane_version }}"
          if [ -z "$ref" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              ref="${{ github.ref_name }}"
            else
              ref=$(git tag --sort=-v:refname | head -n1)
            fi
          fi
          if [ -z "$ref" ]; then
            echo "::error::No Vane tag found to build vane-page against."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out that version into a worktree
        run: git worktree add --detach "$RUNNER_TEMP/vane-ref" "${{ steps.vane_ref.outputs.ref }}"

      - name: Point vane-page at that worktree
        run: |
          cd vane-page
          go mod edit -replace github.com/filipejohansson/vane="$RUNNER_TEMP/vane-ref"

      - name: Build vane-page (release)
        run: ./vane build vane-page --release

      # vane-page/public/index.html references its own assets (style.css,
      # wasm_exec.js, boot.js, favicon.svg) with root-absolute paths, which
      # is correct for the local dev server (always served at "/") and for
      # any app deployed at its domain's root, but wrong here: this is a
      # GitHub Pages *project* page, served under the "/vane/" sub-path
      # instead of domain root, so those paths would otherwise resolve
      # against https://filipejohansson.github.io/ and 404. Prefixing them
      # at this one deploy-specific step keeps public/index.html itself
      # correct for every other use (local dev, `vane build` in general).
      - name: Fix asset paths for the /vane/ sub-path
        run: |
          sed -i \
            -e 's|href="/favicon.svg"|href="/vane/favicon.svg"|' \
            -e 's|href="/style.css"|href="/vane/style.css"|' \
            -e 's|src="/wasm_exec.js"|src="/vane/wasm_exec.js"|' \
            -e 's|src="/boot.js"|src="/vane/boot.js"|' \
            vane-page/dist/index.html

      # GitHub Pages is a static file host: a deep link like /vane/docs has
      # no matching file, so Pages serves its own 404 before the app's
      # client-side router ever loads. Pages special-cases 404.html: it
      # serves that file's content (still with a 404 status) for any
      # unmatched path, so shipping a copy of index.html as 404.html boots
      # the app there too, and the router then renders the real URL from
      # location.pathname. Must run after the asset-path fix above so the
      # copy also has /vane/-prefixed asset paths.
      - name: Create 404.html fallback for client-side routing
        run: cp vane-page/dist/index.html vane-page/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vane-page/dist

      - uses: actions/deploy-pages@v4
        id: deployment

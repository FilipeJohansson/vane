name: Deploy vane-page

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      vane_version:
        description: >-
          Vane git tag to build vane-page against, e.g. v0.2.0. Leave empty to
          use the most recent tag.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time; a newer push supersedes
# whatever's still building instead of queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need full tag history to check out an arbitrary tag below

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # git worktree, not `go get module@tag`: avoids depending on the Go
      # module proxy having indexed the tag yet.
      - name: Resolve Vane version to build vane-page against
        id: vane_ref
        run: |
          ref="${{ inputs.vane_version }}"
          if [ -z "$ref" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              ref="${{ github.ref_name }}"
            else
              ref=$(git tag --sort=-v:refname | head -n1)
            fi
          fi
          if [ -z "$ref" ]; then
            echo "::error::No Vane tag found to build vane-page against."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out that version into a worktree
        run: git worktree add --detach "$RUNNER_TEMP/vane-ref" "${{ steps.vane_ref.outputs.ref }}"

      # Built from the resolved worktree, not the ref that triggered this
      # workflow, so a `workflow_dispatch` with an explicit `vane_version`
      # gets a CLI/compiler that actually matches that version too (runtime/
      # core was already correctly repinned via the worktree `replace` below;
      # this closes the same gap for the CLI itself).
      - name: Build CLI
        run: (cd "$RUNNER_TEMP/vane-ref" && go build -o "$GITHUB_WORKSPACE/vane" .)

      - name: Point vane-page at that worktree
        run: |
          cd vane-page
          go mod edit -replace github.com/filipejohansson/vane="$RUNNER_TEMP/vane-ref"

      - name: Build vane-page (release)
        run: ./vane build vane-page --release

      # GitHub Pages is a static file host: a deep link like /docs has no
      # matching file, so Pages serves its own 404 before the app's
      # client-side router ever loads. Pages special-cases 404.html: it
      # serves that file's content (still with a 404 status) for any
      # unmatched path, so shipping a copy of index.html as 404.html boots
      # the app there too, and the router then renders the real URL from
      # location.pathname. The site is served from the root of its custom
      # domain, so index.html's root-absolute asset paths work as built.
      - name: Create 404.html fallback for client-side routing
        run: cp vane-page/dist/index.html vane-page/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vane-page/dist

      - uses: actions/deploy-pages@v4
        id: deployment

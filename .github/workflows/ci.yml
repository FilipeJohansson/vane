name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call: # lets release.yml re-run this whole workflow as a gate

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.work.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Run security scan
        uses: securego/gosec@v2.22.8
        with:
          args: ./...

      - name: Unit tests (race detector)
        run: go test -race ./...

      - name: DOM tests (jsdom)
        run: make test-dom

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.work.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build Vane CLI
        run: go build -o vane .

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: pnpm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30

  build-examples:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.work.sum

      - name: Build CLI
        run: go build -o vane .

      - name: Build all examples + site against this branch's core/internal
        run: |
          set -e
          for d in examples/*/ vane-page; do
            echo "=== $d ==="
            rel=$(realpath --relative-to="$d" .)
            (cd "$d" && go mod edit -replace github.com/filipejohansson/vane="$rel")
            ./vane build "$d"
          done

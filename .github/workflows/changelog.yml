name: Changelog

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      # Regenerates both files from git history every run: already-tagged
      # releases produce identical output (same tag = same commit range), only
      # [Unreleased] actually changes. A tag push (release cut) re-runs this
      # against the same master tip so [Unreleased] flips to the real version
      # header immediately, instead of waiting for the next unrelated commit.
      #
      # The root changelog and the VS Code extension's changelog are separate
      # release surfaces (independent versioning) split by path, so each is
      # generated with its own config and commit range.
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: cliff.toml
          args: >-
            --github-repo ${{ github.repository }}
            --exclude-path 'tools/vscode-vane/**'
            -o CHANGELOG.md

      - name: Generate vscode-vane CHANGELOG.md
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: tools/vscode-vane/cliff.toml
          args: >-
            --github-repo ${{ github.repository }}
            --include-path 'tools/vscode-vane/**'
            -o tools/vscode-vane/CHANGELOG.md

      - name: Check for changes
        id: diff
        run: |
          changed=false
          git diff --quiet -- CHANGELOG.md || changed=true
          git diff --quiet -- tools/vscode-vane/CHANGELOG.md || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit updated changelogs via GitHub API
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            function additionIfChanged(path) {
              const changed = execSync(`git diff --name-only -- ${path}`).toString().trim() !== '';
              if (!changed) return null;
              const contents = Buffer.from(fs.readFileSync(path, 'utf8'), 'utf8').toString('base64');
              return { path, contents };
            }

            const additions = [
              additionIfChanged('CHANGELOG.md'),
              additionIfChanged('tools/vscode-vane/CHANGELOG.md'),
            ].filter(Boolean);

            const expectedHeadOid = execSync('git rev-parse HEAD').toString().trim();
            const repositoryNameWithOwner = `${context.repo.owner}/${context.repo.repo}`;

            await github.graphql(
              `mutation($repositoryNameWithOwner: String!, $expectedHeadOid: GitObjectID!, $additions: [FileAddition!]) {
                createCommitOnBranch(input: {
                  branch: { repositoryNameWithOwner: $repositoryNameWithOwner, branchName: "master" },
                  message: { headline: "chore: update changelogs" },
                  expectedHeadOid: $expectedHeadOid,
                  fileChanges: { additions: $additions }
                }) {
                  commit { oid url }
                }
              }`,
              { repositoryNameWithOwner, expectedHeadOid, additions }
            );

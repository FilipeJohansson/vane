name: Changelog

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      # Regenerates the whole file from git history every run: already-tagged
      # releases produce identical output (same tag = same commit range), only
      # [Unreleased] actually changes. A tag push (release cut) re-runs this
      # against the same master tip so [Unreleased] flips to the real version
      # header immediately, instead of waiting for the next unrelated commit.
      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: cliff.toml
          args: --github-repo ${{ github.repository }} -o CHANGELOG.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated CHANGELOG.md via GitHub API
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const contents = Buffer.from(content, 'utf8').toString('base64');
            const expectedHeadOid = execSync('git rev-parse HEAD').toString().trim();
            const repositoryNameWithOwner = `${context.repo.owner}/${context.repo.repo}`;

            await github.graphql(
              `mutation($repositoryNameWithOwner: String!, $expectedHeadOid: GitObjectID!, $contents: Base64String!) {
                createCommitOnBranch(input: {
                  branch: { repositoryNameWithOwner: $repositoryNameWithOwner, branchName: "master" },
                  message: { headline: "chore: update CHANGELOG.md" },
                  expectedHeadOid: $expectedHeadOid,
                  fileChanges: { additions: [{ path: "CHANGELOG.md", contents: $contents }] }
                }) {
                  commit { oid url }
                }
              }`,
              { repositoryNameWithOwner, expectedHeadOid, contents }
            );
